<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" role="img" aria-labelledby="dfd-light-title dfd-light-desc">
  <title id="dfd-light-title">ระบบแนะนำหลักสูตรภาควิชาเทคโนโลยีสารสนเทศด้วย Chatbot · Data Flow Diagram (DFD Level 1)</title>
  <desc id="dfd-light-desc">แผนภาพการไหลของข้อมูลระดับ 1 แสดงผู้ใช้งาน, กระบวนการหลัก P1-P5, แหล่งข้อมูล Realtime Database D1-D5, และบริการภายนอก</desc>
  <defs>
    <style>
      .title { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .col-header { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .node-title { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #334155; line-height: 1.35; }
      .node-code { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; fill: #0369a1; }
      .badge-text { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; font-weight: 600; text-transform: uppercase; }
      .edge-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; font-weight: 500; fill: #475569; }
      .legend-text { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="dfd-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#0284c7" />
    </marker>
    <marker id="dfd-arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#0d9488" />
    </marker>
    <marker id="dfd-arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#d97706" />
    </marker>
    <marker id="dfd-arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#7c3aed" />
    </marker>
    <marker id="dfd-arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#059669" />
    </marker>
    <filter id="dfd-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1" rx="12" />

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#e0f2fe" />
    <text x="42" y="15" text-anchor="middle" class="badge-text" fill="#0369a1">DFD LEVEL 1</text>
    <text x="95" y="18" class="title">ระบบแนะนำหลักสูตรภาควิชาเทคโนโลยีสารสนเทศด้วย Chatbot · Data Flow Diagram (DFD Level 1)</text>
    <text x="0" y="42" class="subtitle">จำแนกตามกระบวนการหลัก (P1–P5) สู่แหล่งข้อมูล RTDB (D1–D5) พร้อมระบุสิทธิ์และระบบเจ้าของการเขียนข้อมูล</text>
  </g>

  <!-- Column Headers -->
  <g transform="translate(48, 105)">
    <!-- Col 1: Users -->
    <rect x="0" y="0" width="200" height="32" rx="4" fill="#e0f2fe" />
    <text x="100" y="21" text-anchor="middle" class="col-header" fill="#0369a1">1. ผู้ใช้ระบบ (ACTORS)</text>

    <!-- Col 2: Processes -->
    <rect x="230" y="0" width="370" height="32" rx="4" fill="#f0fdf4" />
    <text x="415" y="21" text-anchor="middle" class="col-header" fill="#15803d">2. กระบวนการ (PROCESSES P1–P5)</text>

    <!-- Col 3: Data Stores -->
    <rect x="630" y="0" width="320" height="32" rx="4" fill="#fef3c7" />
    <text x="790" y="21" text-anchor="middle" class="col-header" fill="#b45309">3. แหล่งข้อมูล (STORES D1–D5)</text>

    <!-- Col 4: External -->
    <rect x="980" y="0" width="204" height="32" rx="4" fill="#f3e8ff" />
    <text x="1082" y="21" text-anchor="middle" class="col-header" fill="#6d28d9">4. ภายนอก (EXTERNAL)</text>
  </g>

  <!-- Connectors (drawn behind nodes) -->
  <!-- Row 1: P1 Auth -->
  <path d="M 248 185 L 278 185" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow-blue)" />
  <path d="M 648 185 L 678 185" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#dfd-arrow-amber)" />
  <path d="M 648 165 L 1028 165" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#dfd-arrow-amber)" />
  <rect x="780" y="156" width="105" height="16" rx="2" fill="#f8fafc" />
  <text x="832" y="168" text-anchor="middle" class="edge-label" fill="#b45309">OAuth Credentials</text>

  <!-- Row 2: P2 Courses -->
  <path d="M 248 300 L 278 300" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow-blue)" />
  <path d="M 648 300 L 678 300" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#dfd-arrow-teal)" />

  <!-- Row 3: P3 Study Plan -->
  <path d="M 248 420 L 278 420" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow-blue)" />
  <path d="M 648 420 L 678 420" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#dfd-arrow-teal)" />

  <!-- Row 4: P4 Chatbot & Feedback -->
  <path d="M 248 540 L 278 540" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow-blue)" />
  <path d="M 648 525 L 1028 525" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#dfd-arrow-purple)" />
  <rect x="770" y="516" width="120" height="16" rx="2" fill="#f8fafc" />
  <text x="830" y="528" text-anchor="middle" class="edge-label" fill="#7c3aed">HTTP Webhook Query</text>

  <!-- P4 to D5 feedback write -->
  <path d="M 648 555 L 678 555" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#dfd-arrow-green)" />
  <rect x="652" y="546" width="22" height="16" rx="2" fill="#f8fafc" />

  <!-- n8n back to D5 chatLogs write -->
  <path d="M 1028 565 L 890 565 L 890 560" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#dfd-arrow-purple)" />
  <rect x="915" y="556" width="90" height="16" rx="2" fill="#f8fafc" />
  <text x="960" y="568" text-anchor="middle" class="edge-label" fill="#7c3aed">writes chatLogs</text>

  <!-- Row 5: P5 Audit & Analytics -->
  <path d="M 248 660 L 278 660" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow-blue)" />
  <path d="M 648 660 L 678 660" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#dfd-arrow-amber)" />

  <!-- ROW 1: AUTHENTICATION -->
  <g transform="translate(48, 150)">
    <!-- User box -->
    <g filter="url(#dfd-shadow)">
      <rect width="200" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" class="node-title">👥 ผู้ใช้งานทุกคน</text>
      <text x="14" y="44" class="node-desc">Guest / Student / Staff /</text>
      <text x="14" y="58" class="node-desc">Instructor / Admin</text>
    </g>

    <!-- Process P1 -->
    <g transform="translate(230, 0)" filter="url(#dfd-shadow)">
      <rect width="370" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#ccfbf1" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#0f766e">P1</text>
      <text x="56" y="24" class="node-title">Authentication &amp; Role Routing</text>
      <text x="14" y="44" class="node-desc">ตรวจสอบ Email Domain @kmutnb.ac.th, สร้าง Session,</text>
      <text x="14" y="58" class="node-desc">กำหนด RBAC Role และบันทึก Audit การเข้าสู่ระบบ</text>
    </g>

    <!-- Data Store D1 -->
    <g transform="translate(630, 0)" filter="url(#dfd-shadow)">
      <rect width="320" height="70" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#fef3c7" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#b45309">D1</text>
      <text x="56" y="24" class="node-title">users/{uid}</text>
      <text x="14" y="44" class="node-desc">เก็บ Role, Email, DisplayName, EnrolledCurriculum,</text>
      <text x="14" y="58" class="node-desc">studentYear (รองรับนักศึกษาปี 1–8+), lastLoginAt</text>
    </g>

    <!-- External Firebase Auth -->
    <g transform="translate(980, 0)" filter="url(#dfd-shadow)">
      <rect width="204" height="70" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
      <text x="12" y="24" class="node-title" font-size="12">🔥 Firebase Auth</text>
      <text x="12" y="44" class="node-desc">Identity Provider,</text>
      <text x="12" y="58" class="node-desc">JWT ID Token Issuer</text>
    </g>
  </g>

  <!-- ROW 2: COURSE & CURRICULUM -->
  <g transform="translate(48, 265)">
    <!-- User box -->
    <g filter="url(#dfd-shadow)">
      <rect width="200" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" class="node-title">🎓 นักศึกษา / 🏢 บุคลากร</text>
      <text x="14" y="44" class="node-desc">ค้นหารายวิชา, เช็ควิชาเปิด,</text>
      <text x="14" y="58" class="node-desc">ปรับปรุงโครงสร้างหลักสูตร</text>
    </g>

    <!-- Process P2 -->
    <g transform="translate(230, 0)" filter="url(#dfd-shadow)">
      <rect width="370" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#ccfbf1" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#0f766e">P2</text>
      <text x="56" y="24" class="node-title">Course &amp; Curriculum Management</text>
      <text x="14" y="44" class="node-desc">Hybrid Precedence: Curriculum RTDB &gt; General &gt; Static</text>
      <text x="14" y="58" class="node-desc">จัดการวิชาตัวต่อ (Prerequisites), กลุ่มวิชาศึกษาทั่วไป</text>
    </g>

    <!-- Data Store D2 -->
    <g transform="translate(630, 0)" filter="url(#dfd-shadow)">
      <rect width="320" height="70" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#fef3c7" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#b45309">D2</text>
      <text x="56" y="24" class="node-title">courses &amp; curriculum/{...}</text>
      <text x="14" y="44" class="node-desc">โครงสร้าง 13 ฉบับ (IT, INE, INET, ITI, ITT)</text>
      <text x="14" y="58" class="node-desc">และดัชนีรายวิชาส่วนกลาง courses/{courseId}</text>
    </g>

    <!-- Static Catalog Note -->
    <g transform="translate(980, 0)" filter="url(#dfd-shadow)">
      <rect width="204" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2" />
      <text x="12" y="24" class="node-title" font-size="12">📚 Master Catalog</text>
      <text x="12" y="44" class="node-desc">Static Master 13 ฉบับ</text>
      <text x="12" y="58" class="node-desc">Fallback 100% แน่นอน</text>
    </g>
  </g>

  <!-- ROW 3: STUDY PLAN & PROGRESS -->
  <g transform="translate(48, 380)">
    <!-- User box -->
    <g filter="url(#dfd-shadow)">
      <rect width="200" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" class="node-title">🎓 นักศึกษา (Student)</text>
      <text x="14" y="44" class="node-desc">วางแผนลงทะเบียนเรียน 4 ปี,</text>
      <text x="14" y="60" class="node-desc">บันทึกเกรด, จำลองผลการเรียน</text>
    </g>

    <!-- Process P3 -->
    <g transform="translate(230, 0)" filter="url(#dfd-shadow)">
      <rect width="370" height="75" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#ccfbf1" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#0f766e">P3</text>
      <text x="56" y="24" class="node-title">Study Plan &amp; Academic Rules Engine</text>
      <text x="14" y="44" class="node-desc">ตรวจสอบหน่วยกิต (9–22), วิทยาทัณฑ์ (≤16), ข้อยกเว้นภาคจบ</text>
      <text x="14" y="60" class="node-desc">Retake Guard บล็อกวิชาที่ติด F และคำนวณ GPAX สะสม</text>
    </g>

    <!-- Data Store D3 -->
    <g transform="translate(630, 0)" filter="url(#dfd-shadow)">
      <rect width="320" height="75" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#fef3c7" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#b45309">D3</text>
      <text x="56" y="24" class="node-title">studyPlans/{pushId}</text>
      <text x="14" y="44" class="node-desc">แผนการเรียนส่วนบุคคล, รายวิชาที่ลงทะเบียน,</text>
      <text x="14" y="60" class="node-desc">เกรดที่ได้, สถานะผ่าน/ตก/ถอน, เกรดฝึกงาน S/U</text>
    </g>

    <!-- PDF/Excel Export -->
    <g transform="translate(980, 0)" filter="url(#dfd-shadow)">
      <rect width="204" height="75" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="12" y="24" class="node-title" font-size="12">📑 Exporters</text>
      <text x="12" y="44" class="node-desc">jsPDF + html2canvas</text>
      <text x="12" y="60" class="node-desc">SheetJS (Excel .xlsx)</text>
    </g>
  </g>

  <!-- ROW 4: AI CHATBOT & FEEDBACK -->
  <g transform="translate(48, 500)">
    <!-- User box -->
    <g filter="url(#dfd-shadow)">
      <rect width="200" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" class="node-title">💬 ผู้ใช้งานแชทบอท</text>
      <text x="14" y="44" class="node-desc">ถามเงื่อนไขหลักสูตร/วิชา,</text>
      <text x="14" y="60" class="node-desc">สถานะตัวเอง, แผนการเรียน,</text>
      <text x="14" y="74" class="node-desc">ส่ง Feedback ประเมินบอท</text>
    </g>

    <!-- Process P4 -->
    <g transform="translate(230, 0)" filter="url(#dfd-shadow)">
      <rect width="370" height="85" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
      <rect width="36" height="18" rx="2" fill="#f3e8ff" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#6d28d9">P4</text>
      <text x="56" y="24" class="node-title" fill="#6d28d9">AI Advising Chat &amp; Sentiment Feedback</text>
      <text x="14" y="44" class="node-desc">• Deterministic User Identity &amp; Role Isolation</text>
      <text x="14" y="58" class="node-desc">• ส่งต่อ Webhook สู่ n8n (Context Injection + Master Catalog)</text>
      <text x="14" y="74" class="node-desc">• Frontend บันทึก chatFeedback/{id} ทุกๆ 5 ข้อความ</text>
    </g>

    <!-- Data Store D5 -->
    <g transform="translate(630, 0)" filter="url(#dfd-shadow)">
      <rect width="320" height="85" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
      <rect width="36" height="18" rx="2" fill="#f3e8ff" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#6d28d9">D5</text>
      <text x="56" y="24" class="node-title">chatLogs &amp; chatFeedback</text>
      <text x="14" y="44" class="node-desc"><tspan fill="#7c3aed" font-weight="600">chatLogs/{id}:</tspan> n8n เป็นผู้บันทึกประวัติการตอบ</text>
      <text x="14" y="60" class="node-desc"><tspan fill="#059669" font-weight="600">chatFeedback/{id}:</tspan> Browser เป็นผู้บันทึกคะแนน</text>
      <text x="14" y="74" class="node-desc">แยกหน้าที่อิสระ ปลอดภัยตามหลัก Zero-Trust</text>
    </g>

    <!-- External n8n AI Engine -->
    <g transform="translate(980, 0)" filter="url(#dfd-shadow)">
      <rect width="204" height="85" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" />
      <text x="12" y="22" class="node-title" font-size="12" fill="#6d28d9">⚡ n8n AI Orchestration</text>
      <text x="12" y="40" class="node-desc">• Pinecone 9 namespaces</text>
      <text x="12" y="54" class="node-desc">• GPT-5 nano Advisor</text>
      <text x="12" y="68" class="node-desc">• Cohere Reranker</text>
    </g>
  </g>

  <!-- ROW 5: AUDIT LOGS & ANALYTICS -->
  <g transform="translate(48, 630)">
    <!-- User box -->
    <g filter="url(#dfd-shadow)">
      <rect width="200" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" class="node-title">⚙️ ผู้ดูแลระบบ (Admin)</text>
      <text x="14" y="44" class="node-desc">ตรวจสอบความปลอดภัย,</text>
      <text x="14" y="58" class="node-desc">วิเคราะห์สถิติและการใช้งาน</text>
    </g>

    <!-- Process P5 -->
    <g transform="translate(230, 0)" filter="url(#dfd-shadow)">
      <rect width="370" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#ccfbf1" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#0f766e">P5</text>
      <text x="56" y="24" class="node-title">Audit Logging &amp; System Analytics</text>
      <text x="14" y="44" class="node-desc">รวบรวมประวัติการแก้ไขข้อมูลหลักสูตร, การเข้าสู่ระบบ,</text>
      <text x="14" y="58" class="node-desc">และวิเคราะห์แนวโน้มคำถาม/คะแนนพึงพอใจของแชทบอท</text>
    </g>

    <!-- Data Store D4 -->
    <g transform="translate(630, 0)" filter="url(#dfd-shadow)">
      <rect width="320" height="70" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
      <rect width="36" height="18" rx="2" fill="#fef3c7" x="12" y="10" />
      <text x="30" y="23" text-anchor="middle" class="badge-text" fill="#b45309">D4</text>
      <text x="56" y="24" class="node-title">auditLogs/{pushId}</text>
      <text x="14" y="44" class="node-desc">เก็บบันทึก Timestamp, Action, TargetId,</text>
      <text x="14" y="58" class="node-desc">Performer UID เพื่อความโปร่งใสและตรวจสอบได้</text>
    </g>

    <!-- Analytics Dashboard View -->
    <g transform="translate(980, 0)" filter="url(#dfd-shadow)">
      <rect width="204" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="12" y="24" class="node-title" font-size="12">📊 Analytics Bar</text>
      <text x="12" y="44" class="node-desc">Bento Metric Summary,</text>
      <text x="12" y="58" class="node-desc">KPI ความพึงพอใจ</text>
    </g>
  </g>

