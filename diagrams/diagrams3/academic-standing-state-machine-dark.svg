<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" role="img" aria-labelledby="stand-dark-title stand-dark-desc">
  <title id="stand-dark-title">ระบบสถานะวิชาการและการพ้นสภาพ (Academic Standing &amp; Retirement Guard State Machine)</title>
  <desc id="stand-dark-desc">State Machine แผนภาพสถานะวิชาการ 4 ระดับ: ปกติ, โปรสูง, โปรต่ำ, รีไทร์ พร้อมเงื่อนไขการสะสม 4 ภาคปกติและเป้าหมายกู้เกรด</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .font-sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Geist Mono', monospace; }
      .title-dark { font-size: 20px; font-weight: 700; fill: #f1f5f9; }
      .subtitle-dark { font-size: 13px; fill: #94a3b8; }
      .badge-text-dark { font-size: 9px; font-weight: 600; text-transform: uppercase; }
      .state-title-dark { font-size: 14px; font-weight: 700; }
      .state-sub-dark { font-size: 11px; fill: #94a3b8; }
      .state-rule-dark { font-size: 10.5px; fill: #cbd5e1; line-height: 1.4; }
      .state-code-dark { font-family: 'Geist Mono', monospace; font-size: 10px; }
      .trans-label-dark { font-size: 9.5px; font-weight: 600; }
      .note-text-dark { font-size: 10px; fill: #64748b; }
    </style>
    <marker id="arrow-emerald-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 6 3.5 L 0 6.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-blue-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 6 3.5 L 0 6.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 6 3.5 L 0 6.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 6 3.5 L 0 6.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-slate-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0.5 L 6 3.5 L 0 6.5 z" fill="#94a3b8"/>
    </marker>
    <filter id="card-shadow-dark" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="67" y="15" text-anchor="middle" class="font-mono badge-text-dark" fill="#38bdf8">STATE MACHINE</text>
    <text x="145" y="18" class="font-sans title-dark">ระบบสถานะวิชาการและการพ้นสภาพ (Academic Standing &amp; Retirement Guard)</text>
    <text x="0" y="42" class="font-sans subtitle-dark">สถานะวิชาการ 4 ระดับ (ปกติ / โปรสูง / โปรต่ำ / พ้นสภาพ), กฎการนับ 4 ภาคปกติ, ข้อยกเว้นภาคฤดูร้อน และเป้าหมายกู้เกรด</text>
  </g>

  <!-- Transitions / Connecting Paths (Drawn under state cards) -->
  <g fill="none" stroke-width="1.4">
    <!-- Initial Entry to Decision -->
    <path d="M 100 160 H 160" stroke="#38bdf8" marker-end="url(#arrow-blue-dark)"/>

    <!-- Eval Decision to NORMAL -->
    <path d="M 330 160 H 420" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald-dark)"/>
    <rect x="338" y="142" width="75" height="16" rx="3" fill="#161b22" stroke="#059669" stroke-width="1"/>
    <text x="375" y="154" text-anchor="middle" class="font-mono trans-label-dark" fill="#34d399">GPAX ≥ 2.00</text>

    <!-- Eval Decision down to PROBATION 2 (High) -->
    <path d="M 245 205 V 360 Q 245 370 255 370 H 420" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-blue-dark)"/>
    <rect x="252" y="300" width="125" height="16" rx="3" fill="#161b22" stroke="#0284c7" stroke-width="1"/>
    <text x="314" y="312" text-anchor="middle" class="font-sans trans-label-dark" fill="#38bdf8">1.75 ≤ GPAX &lt; 2.00</text>

    <!-- Eval Decision down to PROBATION 1 (Low) -->
    <path d="M 235 205 V 530 Q 235 540 245 540 H 420" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrow-amber-dark)"/>
    <rect x="242" y="470" width="125" height="16" rx="3" fill="#161b22" stroke="#d97706" stroke-width="1"/>
    <text x="304" y="482" text-anchor="middle" class="font-sans trans-label-dark" fill="#fbbf24">1.50 ≤ GPAX &lt; 1.75</text>

    <!-- Eval Decision down to IMMEDIATE RETIREMENT (GPAX < 1.50 and terms >= 2) -->
    <path d="M 225 205 V 700 Q 225 710 235 710 H 420" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#arrow-rose-dark)"/>
    <rect x="232" y="650" width="170" height="16" rx="3" fill="#161b22" stroke="#e11d48" stroke-width="1"/>
    <text x="317" y="662" text-anchor="middle" class="font-sans trans-label-dark" fill="#fb7185">GPAX &lt; 1.50 (หลังปี 1 เทอม 2)</text>

    <!-- Recovery from PROBATION 2 back to NORMAL -->
    <path d="M 680 340 V 225" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-emerald-dark)"/>
    <rect x="690" y="270" width="138" height="16" rx="3" fill="#161b22" stroke="#059669" stroke-width="1"/>
    <text x="759" y="282" text-anchor="middle" class="font-sans trans-label-dark" fill="#34d399">กู้เกรดสำเร็จ GPAX ≥ 2.00 (Reset=0)</text>

    <!-- Recovery from PROBATION 1 back to NORMAL -->
    <path d="M 720 510 V 225" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-emerald-dark)"/>
    <rect x="730" y="440" width="138" height="16" rx="3" fill="#161b22" stroke="#059669" stroke-width="1"/>
    <text x="799" y="452" text-anchor="middle" class="font-sans trans-label-dark" fill="#34d399">กู้เกรดสำเร็จ GPAX ≥ 2.00 (Reset=0)</text>

    <!-- Probation 2 & 1 to Counter Engine -->
    <path d="M 690 390 H 870" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow-slate-dark)"/>
    <path d="M 690 560 H 870" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow-slate-dark)"/>

    <!-- Counter to RETIRED (when count >= 4) -->
    <path d="M 990 605 V 660 Q 990 710 900 710 H 690" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#arrow-rose-dark)"/>
    <rect x="850" y="692" width="180" height="16" rx="3" fill="#161b22" stroke="#e11d48" stroke-width="1"/>
    <text x="940" y="704" text-anchor="middle" class="font-sans trans-label-dark" fill="#fb7185">ติดโปรครบ 4 ภาคปกติ (Count ≥ 4)</text>
  </g>

  <!-- START NODE -->
  <g transform="translate(56, 140)">
    <circle cx="20" cy="20" r="16" fill="#0284c7"/>
    <circle cx="20" cy="20" r="10" fill="#0d1117"/>
    <circle cx="20" cy="20" r="5" fill="#38bdf8"/>
    <text x="20" y="52" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f1f5f9">ประเมินผลการเรียน</text>
    <text x="20" y="65" text-anchor="middle" class="font-mono note-text-dark">หลังสรุปแต่ละภาค</text>
  </g>

  <!-- DECISION DIAMOND / GATEWAY -->
  <g transform="translate(160, 115)" filter="url(#card-shadow-dark)">
    <polygon points="85,0 170,45 85,90 0,45" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="42" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#f1f5f9">ตรวจสอบเกณฑ์</text>
    <text x="85" y="56" text-anchor="middle" class="font-mono" font-size="10.5" fill="#38bdf8">GPAX &amp; ภาคเรียน</text>
  </g>

  <!-- STATE 1: NORMAL (สถานะปกติ) -->
  <g transform="translate(420, 105)" filter="url(#card-shadow-dark)">
    <rect width="270" height="110" rx="8" fill="#161b22" stroke="#059669" stroke-width="1.8"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="rgba(52, 211, 153, 0.15)"/>
    <text x="49" y="28" text-anchor="middle" class="font-mono badge-text-dark" fill="#34d399">STATUS 01</text>
    <text x="94" y="29" class="font-sans state-title-dark" fill="#6ee7b7">สถานะปกติ (Normal)</text>
    <text x="14" y="52" class="font-sans state-rule-dark">• GPAX สะสม <tspan font-weight="700" fill="#34d399">≥ 2.00</tspan></text>
    <text x="14" y="70" class="font-sans state-rule-dark">• โควตาลงทะเบียน: <tspan font-weight="600" fill="#f1f5f9">9 - 22 หน่วยกิต</tspan> (ภาคปกติ)</text>
    <text x="14" y="88" class="font-sans state-rule-dark">• ตัวนับติดโปรต่อเนื่อง <tspan font-weight="700" fill="#34d399">รีเซ็ตเป็น 0 เทอม</tspan></text>
    <text x="14" y="102" class="font-mono state-code-dark" fill="#34d399">academicStanding: "normal" | probationCount: 0</text>
  </g>

  <!-- STATE 2: PROBATION 2 (วิทยาทัณฑ์โปรสูง) -->
  <g transform="translate(420, 315)" filter="url(#card-shadow-dark)">
    <rect width="270" height="110" rx="8" fill="#161b22" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="49" y="28" text-anchor="middle" class="font-mono badge-text-dark" fill="#38bdf8">STATUS 02</text>
    <text x="94" y="29" class="font-sans state-title-dark" fill="#7dd3fc">วิทยาทัณฑ์โปรสูง (High Prob.)</text>
    <text x="14" y="52" class="font-sans state-rule-dark">• GPAX สะสม <tspan font-weight="700" fill="#38bdf8">1.75 - 1.99</tspan></text>
    <text x="14" y="70" class="font-sans state-rule-dark">• โควตาลงทะเบียน: <tspan font-weight="700" fill="#fbbf24">สูงสุดไม่เกิน 16 หน่วยกิต</tspan></text>
    <text x="14" y="88" class="font-sans state-rule-dark">• นับสะสมเทอมโปร (+1 ถ้าเป็นภาค 1 หรือ 2)</text>
    <text x="14" y="102" class="font-mono state-code-dark" fill="#38bdf8">academicStanding: "probation_high" | maxCredits: 16</text>
  </g>

  <!-- STATE 3: PROBATION 1 (วิทยาทัณฑ์โปรต่ำ) -->
  <g transform="translate(420, 485)" filter="url(#card-shadow-dark)">
    <rect width="270" height="110" rx="8" fill="#161b22" stroke="#d97706" stroke-width="1.8"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="rgba(251, 191, 36, 0.15)"/>
    <text x="49" y="28" text-anchor="middle" class="font-mono badge-text-dark" fill="#fbbf24">STATUS 03</text>
    <text x="94" y="29" class="font-sans state-title-dark" fill="#fcd34d">วิทยาทัณฑ์โปรต่ำ (Low Prob.)</text>
    <text x="14" y="52" class="font-sans state-rule-dark">• GPAX สะสม <tspan font-weight="700" fill="#fbbf24">1.50 - 1.74</tspan></text>
    <text x="14" y="70" class="font-sans state-rule-dark">• โควตาลงทะเบียน: <tspan font-weight="700" fill="#fbbf24">สูงสุดไม่เกิน 16 หน่วยกิต</tspan></text>
    <text x="14" y="88" class="font-sans state-rule-dark">• ⚠️ ระวังรีไทร์: ติดโปรได้ไม่เกิน 4 เทอมติดต่อกัน</text>
    <text x="14" y="102" class="font-mono state-code-dark" fill="#fbbf24">academicStanding: "probation_low" | maxTerms: 4</text>
  </g>

  <!-- STATE 4: RETIRED (พ้นสภาพนักศึกษา) -->
  <g transform="translate(420, 655)" filter="url(#card-shadow-dark)">
    <rect width="270" height="115" rx="8" fill="#161b22" stroke="#e11d48" stroke-width="2"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="rgba(244, 63, 94, 0.15)"/>
    <text x="49" y="28" text-anchor="middle" class="font-mono badge-text-dark" fill="#fb7185">STATUS 04</text>
    <text x="94" y="29" class="font-sans state-title-dark" fill="#fda4af">พ้นสภาพนักศึกษา (Retired)</text>
    <text x="14" y="52" class="font-sans state-rule-dark">• <tspan font-weight="700" fill="#fb7185">สาเหตุ 1:</tspan> GPAX &lt; 1.50 (ประเมินหลังปี 1 ภาค 2)</text>
    <text x="14" y="70" class="font-sans state-rule-dark">• <tspan font-weight="700" fill="#fb7185">สาเหตุ 2:</tspan> ติดโปร (GPAX &lt; 2.00) ครบ 4 ภาคปกติ</text>
    <text x="14" y="88" class="font-sans state-rule-dark">• ระบบแจ้งเตือนฉุกเฉินและประสานงานอาจารย์ที่ปรึกษา</text>
    <text x="14" y="104" class="font-mono state-code-dark" fill="#f43f5e">academicStanding: "retired" | locked: true</text>
  </g>

  <!-- CONSECUTIVE PROBATION TRACKER CARD -->
  <g transform="translate(870, 315)" filter="url(#card-shadow-dark)">
    <rect width="360" height="290" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <rect x="16" y="16" width="105" height="20" rx="4" fill="#21262d"/>
    <text x="68" y="30" text-anchor="middle" class="font-mono badge-text-dark" fill="#8b949e">TRACKER ENGINE</text>
    <text x="130" y="31" class="font-sans state-title-dark" fill="#f1f5f9">กลไกนับ 4 ภาคการศึกษาปกติ</text>

    <!-- Stepper Graphic 1 to 4 -->
    <g transform="translate(20, 56)">
      <!-- Step 1 -->
      <circle cx="20" cy="20" r="15" fill="rgba(251, 191, 36, 0.15)" stroke="#d97706" stroke-width="1.5"/>
      <text x="20" y="24" text-anchor="middle" class="font-sans" font-weight="700" font-size="11" fill="#fbbf24">1</text>
      <text x="20" y="46" text-anchor="middle" class="font-sans" font-size="9" fill="#8b949e">ภาคที่ 1</text>

      <line x1="36" y1="20" x2="84" y2="20" stroke="#30363d" stroke-width="2"/>

      <!-- Step 2 -->
      <circle cx="100" cy="20" r="15" fill="rgba(251, 191, 36, 0.15)" stroke="#d97706" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" class="font-sans" font-weight="700" font-size="11" fill="#fbbf24">2</text>
      <text x="100" y="46" text-anchor="middle" class="font-sans" font-size="9" fill="#8b949e">ภาคที่ 2</text>

      <line x1="116" y1="20" x2="164" y2="20" stroke="#30363d" stroke-width="2"/>

      <!-- Step 3 -->
      <circle cx="180" cy="20" r="15" fill="rgba(234, 88, 12, 0.15)" stroke="#ea580c" stroke-width="1.5"/>
      <text x="180" y="24" text-anchor="middle" class="font-sans" font-weight="700" font-size="11" fill="#fb923c">3</text>
      <text x="180" y="46" text-anchor="middle" class="font-sans" font-size="9" fill="#fb923c">วิกฤต (3)</text>

      <line x1="196" y1="20" x2="244" y2="20" stroke="#30363d" stroke-width="2"/>

      <!-- Step 4 -->
      <circle cx="260" cy="20" r="15" fill="rgba(244, 63, 94, 0.15)" stroke="#e11d48" stroke-width="2"/>
      <text x="260" y="24" text-anchor="middle" class="font-sans" font-weight="700" font-size="11" fill="#f43f5e">4</text>
      <text x="260" y="46" text-anchor="middle" class="font-sans" font-size="9" font-weight="700" fill="#f43f5e">รีไทร์ทันที</text>
    </g>

    <!-- Tracker Rules List -->
    <g transform="translate(16, 126)">
      <rect width="328" height="60" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="20" class="font-sans" font-size="11" font-weight="600" fill="#f1f5f9">📌 กฎการนับและข้อยกเว้นภาคฤดูร้อน (Summer):</text>
      <text x="12" y="36" class="font-sans" font-size="10" fill="#8b949e">• นับเฉพาะ <tspan font-weight="600" fill="#cbd5e1">ภาคเรียนปกติ (Semester 1 &amp; 2)</tspan> เท่านั้น</text>
      <text x="12" y="50" class="font-sans" font-size="10" fill="#8b949e">• <tspan font-weight="600" fill="#38bdf8">ภาคฤดูร้อน (Semester 3)</tspan>: คำนวณ GPAX แต่ <tspan font-weight="600" fill="#38bdf8">ไม่เพิ่มตัวนับ</tspan></text>
    </g>

    <!-- GPA Recovery Target Box -->
    <g transform="translate(16, 198)">
      <rect width="328" height="76" rx="6" fill="#0d1117" stroke="#1d4ed8" stroke-width="1"/>
      <text x="12" y="20" class="font-sans" font-size="11" font-weight="600" fill="#60a5fa">🎯 เครื่องมือคำนวณเกรดกู้สถานะ (Target GPA):</text>
      <text x="12" y="38" class="font-mono" font-size="9.5" fill="#93c5fd">Target GPA = [2.00 × (Cr_old + Cr_new) - P_old] / Cr_new</text>
      <text x="12" y="54" class="font-sans" font-size="10" fill="#cbd5e1">• ปัดเศษทศนิยมขึ้นเสมอ <tspan class="font-mono" font-weight="600" fill="#38bdf8">Math.ceil(raw * 100) / 100</tspan></text>
      <text x="12" y="68" class="font-sans" font-size="10" fill="#34d399">• เพื่อการันตีว่า GPAX สะสมจะถึง 2.00 พอดี ไม่ปัดตก</text>
    </g>
  </g>

  <!-- FOOTER / AUDIT INFO -->
  <g transform="translate(48, 785)">
    <text x="0" y="0" class="font-mono note-text-dark">อ้างอิง: ข้อบังคับมหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ ว่าด้วยการศึกษาระดับปริญญาบัณฑิต · ADR-011</text>
    <text x="1184" y="0" text-anchor="end" class="font-mono note-text-dark">KMUTNB IT Course Advising System · Automated Academic Standing Engine</text>
  </g>
</svg>
